name: Build Talos for Mixtile Blade 3

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: OCI tag for the Blade 3 overlay
        required: false
        default: ""

permissions:
  contents: read
  packages: write

concurrency:
  group: blade3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Enable ARM64 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select image coordinates
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.image_tag }}
        run: |
          owner=${GITHUB_REPOSITORY_OWNER,,}
          tag=${REQUESTED_TAG:-ci-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::8}}
          echo "USERNAME=${owner}" >> "${GITHUB_ENV}"
          echo "IMAGE_TAG=${tag}" >> "${GITHUB_ENV}"

      - name: Build overlay and Talos images
        run: ./build.sh all

      - name: Upload boot artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mixtile-blade3-talos-${{ env.IMAGE_TAG }}
          path: _out/
          if-no-files-found: error
          retention-days: 14
